name: Release workflow for tagged versions
on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - 'v*' # Push events to matching v*, i.e. v0.2.19, v0.2.14a

env:
  GO_VERSION: "1.25"
  GOEXPERIMENT: jsonv2
  USE_BROTLI: 1
  USE_LIBSODIUM: 1
  USE_LZO: 1
  DEBIAN_FRONTEND: noninteractive

jobs:
  # Prevents race conditions by creating the release only once before uploads.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-ubuntu:
    needs: create-release
    strategy:
      matrix:
        # grunt-it fork: we only consume the Postgres binary, so build pg only
        # (faster/cheaper releases). The age crypter is DB-agnostic; re-add other
        # db targets here if ever needed.
        os: [20.04, 22.04, 24.04]
        db: [pg]
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    name: wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ contains(matrix.runner, 'arm') &&'aarch64' || 'amd64' }}
    container:
      image: ubuntu:${{ matrix.os }}
    steps:

      - name: Determine arch
        id: determine-arch
        run: |
          case $(uname -m) in
            'aarch64') arch='aarch64' ;;
            'x86_64')  arch='amd64' ;;
            *) arch='unknown' ;;
          esac
          echo "arch=$arch" >> $GITHUB_OUTPUT

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y liblzo2-dev brotli libsodium-dev curl git cmake build-essential tzdata

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go 1.x
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go

      - name: Get dependencies
        run: go get -v -t ./...

      - name: Mark repo and submodule as safe
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global --add safe.directory $GITHUB_WORKSPACE/submodules/brotli
 
      - name: Make deps
        run: make deps

      - name: Build WAL-G
        run: make ${{ matrix.db }}_build

      - name: Rename WAL-G binary
        run: mv main/${{ matrix.db }}/wal-g wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}

      - name: Compress WAL-G binary
        run: tar --owner=0 --group=0 -zcvf wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}.tar.gz wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}

      - name: Calculate checksum
        run: sha256sum wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }} > wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}.sha256

      - name: Calculate checksum for the compressed binary
        run: sha256sum wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}.tar.gz > wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}.tar.gz.sha256

      - name: Upload WAL-G binary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}
            wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}.tar.gz
            wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}.sha256
            wal-g-${{ matrix.db }}-${{ matrix.os }}-${{ steps.determine-arch.outputs.arch }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-static:
    needs: create-release
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    name: wal-g-pg-static-${{ contains(matrix.runner, 'arm') && 'aarch64' || 'amd64' }}
    env:
      CGO_ENABLED: 0
      USE_BROTLI: ""
      USE_LIBSODIUM: ""
      USE_LZO: ""
    steps:
      - name: Determine arch
        id: determine-arch
        run: |
          case $(uname -m) in
            'aarch64') arch='aarch64' ;;
            'x86_64')  arch='amd64' ;;
            *) exit 1 ;;
          esac
          echo "arch=$arch" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Prepare Go dependencies
        run: make go_deps

      - name: Build static WAL-G
        run: make pg_build

      - name: Verify static binary
        run: |
          if ldd main/pg/wal-g 2>&1 | grep -q '=>'; then exit 1; fi
          main/pg/wal-g --version

      - name: Prepare release assets
        run: |
          asset="wal-g-pg-static-${{ steps.determine-arch.outputs.arch }}"
          mv main/pg/wal-g "$asset"
          tar --owner=0 --group=0 -zcvf "$asset.tar.gz" "$asset"
          sha256sum "$asset" > "$asset.sha256"
          sha256sum "$asset.tar.gz" > "$asset.tar.gz.sha256"

      - name: Upload static WAL-G binary
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wal-g-pg-static-${{ steps.determine-arch.outputs.arch }}
            wal-g-pg-static-${{ steps.determine-arch.outputs.arch }}.tar.gz
            wal-g-pg-static-${{ steps.determine-arch.outputs.arch }}.sha256
            wal-g-pg-static-${{ steps.determine-arch.outputs.arch }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
